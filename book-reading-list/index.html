
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reading List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Book Reading List</h1>
        <p>Track the books you want to read.</p>

        <form id="bookForm">
            <input type="text" id="bookTitle" placeholder="Enter book title" required>
            <input type="text" id="bookAuthor" placeholder="Enter author name" required>
            <button type="submit">Add Book</button>
        </form>

        <ul id="bookList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
